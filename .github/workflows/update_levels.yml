name: Update CME Levels Daily

on:
  schedule:
    - cron: '0 5 * * 1-5' # Runs at 05:00 UTC Monday-Friday (08:00 MSK)
  workflow_dispatch: # Allows manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run CME Parsing and Math Pipeline
        run: |
          python main.py

      - name: Commit and push generated CSV data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CME Levels [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
